name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check unique numeric migration versions
        run: |
          python - <<'PY'
          from pathlib import Path

          files = sorted(Path("supabase/migrations").glob("*.sql"))
          versions = [path.name.split("_", 1)[0] for path in files]
          if any(not version.isdigit() for version in versions):
              raise SystemExit("Every migration filename must start with a numeric version.")
          if len(versions) != len(set(versions)):
              raise SystemExit("Duplicate Supabase migration version found.")
          print(f"Validated {len(files)} uniquely versioned migrations.")
          PY
